name: Windows 11 x64 build and validation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyserial pyinstaller

      - name: Compile all desktop Python modules
        run: python -m compileall -q main.py jroc_mobile jroc_samsung tests

      - name: Run desktop regression tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows desktop app
        run: pyinstaller --noconfirm --clean --windowed --name "J-Roc AI Mobile Repair" main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile x64 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "J-Roc-AI-Mobile-Repair.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = "release/J-Roc-AI-Mobile-Repair-v0.4.0-Setup-x64.exe"
          if (-not (Test-Path $setup)) { throw "Expected installer not found: $setup" }

      - name: Smoke-test installer and uninstaller
        shell: pwsh
        run: |
          $setup = (Resolve-Path "release/J-Roc-AI-Mobile-Repair-v0.4.0-Setup-x64.exe").Path
          $testDir = Join-Path $env:RUNNER_TEMP "JROC_MobileRepair_Test"
          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$testDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $appExe = Join-Path $testDir "J-Roc AI Mobile Repair.exe"
          if (-not (Test-Path $appExe)) { throw "Installed application executable is missing." }
          $uninstaller = Join-Path $testDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          if (Test-Path $appExe) { throw "Application executable remains after uninstall." }

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          Get-ChildItem release -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content -Encoding ascii release/SHA256SUMS-windows.txt

      - name: Upload Windows x64 validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: J-Roc-AI-Mobile-Repair-v0.4.0-Windows-x64
          path: |
            release/J-Roc-AI-Mobile-Repair-v0.4.0-Setup-x64.exe
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14
