name: Windows 11 x64 build and installer

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Compile Python modules
        run: python -m compileall -q backend_bus config core_swarm matrix_controls dashboard_server.py main.py

      - name: Install test and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-dev.txt) {
            python -m pip install -r requirements-dev.txt
          } else {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller

      - name: Run unit tests
        shell: pwsh
        run: |
          if (Test-Path tests) {
            python -m unittest discover -s tests -v
          } elseif (Test-Path test_core.py) {
            python -m unittest -v test_core test_mobile_repair
          } else {
            throw "No recognized test suite found; refusing to publish an untested build."
          }

      - name: Package local CAM dashboard server
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --console --name "J-ROC AI CAM PRO" dashboard_server.py --add-data "dashboard_ui;dashboard_ui" --collect-submodules backend_bus --collect-submodules config --collect-submodules core_swarm --collect-submodules matrix_controls
          if (-not (Test-Path "dist/J-ROC AI CAM PRO/J-ROC AI CAM PRO.exe")) {
            throw "Expected packaged CAM PRO executable was not produced."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "J-Roc-AI-Mobile-Repair.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = Get-ChildItem release -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) { throw "No setup executable was created." }

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Upload Windows installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: J-ROC-AI-CAM-PRO-Windows-x64
          path: release/*
          if-no-files-found: error
